name: Java CI

on:
  push:
    branches:
      - testes

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vaideboa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d vaideboa_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Aguardar PostgreSQL
        run: |
          until pg_isready -h localhost -U postgres -d vaideboa_test; do
            echo "Aguardando PostgreSQL..."
            sleep 2
          done
          
      - name: Criar extensões PostGIS
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d vaideboa_test -c "CREATE EXTENSION IF NOT EXISTS postgis;"
          psql -h localhost -U postgres -d vaideboa_test -c "CREATE EXTENSION IF NOT EXISTS postgis_topology;"

      - name: Importar backup SQL
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d vaideboa_test -f .github/workflows/backup_vaideboa_test.sql

      - name: Build Maven
        run: mvn clean install -DskipTests

      - name: Rodar testes
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/vaideboa_test
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
        run: mvn test

      - name: Mostrar logs se falhar
        if: failure()
        run: |
          find . -path "*surefire-reports*" -type f -exec cat {} \;
